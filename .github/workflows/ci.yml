name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {python-version: ['3.9', '3.11', '3.12']}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: pip install -e '.[dev]'
      - name: Configure Spark Python runtime
        shell: bash
        run: |
          echo "PYSPARK_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYSPARK_DRIVER_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "SPARK_LOCAL_IP=127.0.0.1" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
