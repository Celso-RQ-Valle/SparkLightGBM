[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "sparklightgbm"
version = "0.1.0b1"
description = "Beta: a lightweight Python bridge between Apache Spark DataFrames and official LightGBM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "SparkLightGBM contributors" }]
keywords = ["apache-spark", "lightgbm", "pyspark", "machine-learning"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.21", "lightgbm>=4.0"]
[project.optional-dependencies]
spark = ["pyspark>=3.5.9,<4"]
test = ["pytest>=7", "pyspark>=3.3,<4"]
dev = ["build>=1", "twine>=5", "ruff>=0.6", "pytest>=7", "pyspark>=3.5.9,<4"]
[project.urls]
Homepage = "https://github.com/Celso-RQ-Valle/SparkLightGBM"
Repository = "https://github.com/Celso-RQ-Valle/SparkLightGBM"
[tool.hatch.build.targets.wheel]
packages = ["src/sparklightgbm"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
